[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-engine"
version = "0.1.0"
description = "Goal-based multi-asset portfolio engine: walk-forward research on allocation methods for a Taiwan-based investor."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "pyyaml>=6",
    "scipy>=1.10",
    "cvxpy>=1.4",
]

[project.optional-dependencies]
download = ["yfinance>=0.2.40"]
# Established libraries the tests cross-check every optimiser against.
crosscheck = ["pyportfolioopt>=1.5", "riskfolio-lib>=6", "scikit-learn>=1.3"]
dev = ["pytest>=7", "pyportfolioopt>=1.5", "riskfolio-lib>=6", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
