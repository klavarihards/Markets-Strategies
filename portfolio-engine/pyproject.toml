[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-engine"
version = "0.1.0"
description = "Goal-based multi-asset portfolio engine: walk-forward research on allocation methods for a Taiwan-based investor."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "pyyaml>=6",
    "scipy>=1.10",
    "cvxpy>=1.4",
    "arch>=6",
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
download = ["yfinance>=0.2.40"]
# Established libraries the tests cross-check every optimiser against.
crosscheck = ["pyportfolioopt>=1.5", "riskfolio-lib>=6", "scikit-learn>=1.3"]
# The client product: API, dashboard and PDF report.
product = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "xhtml2pdf>=0.2.11", "matplotlib>=3.7",
           "streamlit>=1.35"]
dev = ["pytest>=7", "ruff>=0.5", "pyportfolioopt>=1.5", "riskfolio-lib>=6", "scikit-learn>=1.3",
       "httpx>=0.27", "fastapi>=0.110", "jinja2>=3.1", "xhtml2pdf>=0.2.11", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portfolio_engine = ["product/templates/*.html"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
